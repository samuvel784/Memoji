<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>

    <!-- Card 1 (Blue) Gradient -->
    <linearGradient id="blueCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Card 2 (Cyan) Gradient -->
    <linearGradient id="cyanCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Star Face Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadow for Cards -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base (Squircle Mask) -->
  <rect width="512" height="512" rx="112" fill="url(#spaceBg)"/>

  <!-- Cosmic Stars / Sparkles in Background -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="90" cy="110" r="3" opacity="0.9"/>
    <circle cx="420" cy="90" r="2" opacity="0.7"/>
    <circle cx="440" cy="380" r="3.5" opacity="0.8"/>
    <circle cx="70" cy="410" r="2.5" opacity="0.6"/>
    <path d="M256,60 L258,70 L268,72 L258,74 L256,84 L254,74 L244,72 L254,70 Z" fill="#FDE047" opacity="0.6"/>
    <path d="M410,210 L411,215 L416,216 L411,217 L410,222 L409,217 L404,216 L409,215 Z" fill="#38BDF8" opacity="0.7"/>
    <path d="M110,280 L111,283 L114,284 L111,285 L110,288 L109,285 L106,284 L109,283 Z" fill="#F472B6" opacity="0.7"/>
  </g>

  <!-- Left Card (Blue, Tilted Left) -->
  <g transform="translate(145, 275) rotate(-14) translate(-145, -275)" filter="url(#dropShadow)">
    <rect x="75" y="115" width="160" height="230" rx="26" fill="url(#blueCardGrad)" stroke="#93C5FD" stroke-width="4"/>

    <!-- Star Character 1 (Smiling Happy Star) -->
    <g transform="translate(155, 230)">
      <!-- Star Body -->
      <path d="M0,-55 L14,-18 L52,-14 L23,11 L32,48 L0,28 L-32,48 L-23,11 L-52,-14 L-14,-18 Z" fill="url(#starGrad)" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Rosy Cheeks -->
      <circle cx="-22" cy="10" r="6" fill="#FDA4AF" opacity="0.8"/>
      <circle cx="22" cy="10" r="6" fill="#FDA4AF" opacity="0.8"/>
      <!-- Eyes -->
      <circle cx="-12" cy="-2" r="5" fill="#1E1B4B"/>
      <circle cx="12" cy="-2" r="5" fill="#1E1B4B"/>
      <circle cx="-10" cy="-4" r="2" fill="#FFFFFF"/>
      <circle cx="14" cy="-4" r="2" fill="#FFFFFF"/>
      <!-- Smile -->
      <path d="M-10,12 Q0,22 10,12" fill="none" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Card (Cyan/Turquoise, Tilted Right) -->
  <g transform="translate(325, 260) rotate(12) translate(-325, -260)" filter="url(#dropShadow)">
    <rect x="245" y="100" width="160" height="230" rx="26" fill="url(#cyanCardGrad)" stroke="#67E8F9" stroke-width="4"/>

    <!-- Star Character 2 (Winking Happy Star) -->
    <g transform="translate(325, 215)">
      <!-- Star Body -->
      <path d="M0,-55 L14,-18 L52,-14 L23,11 L32,48 L0,28 L-32,48 L-23,11 L-52,-14 L-14,-18 Z" fill="url(#starGrad)" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Rosy Cheeks -->
      <circle cx="-22" cy="10" r="6" fill="#FDA4AF" opacity="0.8"/>
      <circle cx="22" cy="10" r="6" fill="#FDA4AF" opacity="0.8"/>
      <!-- Winking Left Eye (Arc) -->
      <path d="M-16,0 Q-12,-6 -8,0" fill="none" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
      <!-- Right Eye (Happy Dot) -->
      <circle cx="12" cy="-2" r="5" fill="#1E1B4B"/>
      <circle cx="14" cy="-4" r="2" fill="#FFFFFF"/>
      <!-- Smile -->
      <path d="M-10,10 Q0,20 10,10" fill="none" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Foreground Star Sparkle Overlays -->
  <g filter="url(#glow)">
    <path d="M120,180 L123,192 L135,195 L123,198 L120,210 L117,198 L105,195 L117,192 Z" fill="#FDE047"/>
    <path d="M390,120 L392,127 L399,129 L392,131 L390,138 L388,131 L381,129 L388,127 Z" fill="#67E8F9"/>
  </g>
</svg>
